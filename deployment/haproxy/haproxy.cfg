#---------------------------------------------------------------------
# SENTINEL — Lb01 HAProxy Load Balancer Configuration
# Distributes incoming traffic across Web01 and Web02 with active
# HTTP health and readiness checks (/api/v1/ready)
#---------------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  60000ms
    timeout server  60000ms
    retries 3
    option  redispatch

#---------------------------------------------------------------------
# Lb01 Frontend — Incoming Traffic & Load Balancer Health Endpoint
#---------------------------------------------------------------------
frontend sentinel_http_front
    bind *:80
    # Optional HTTPS TLS termination:
    # bind *:443 ssl crt /etc/ssl/private/sentinel.pem

    # Dedicated Lb01 Load Balancer Health Check Endpoint
    acl is_lb_health path_exact /lb-health
    http-request return status 200 content-type "application/json" string "{\"status\":\"ok\",\"role\":\"lb01\",\"loadBalancer\":\"HAProxy\"}" if is_lb_health

    # Security response headers at edge
    http-response set-header X-Load-Balancer lb01
    default_backend sentinel_web_cluster

#---------------------------------------------------------------------
# HAProxy Telemetry & Maintenance Admin Dashboard (Port 8404)
#---------------------------------------------------------------------
frontend haproxy_stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

#---------------------------------------------------------------------
# Backend Pool — Web01 and Web02 Application Servers
#---------------------------------------------------------------------
backend sentinel_web_cluster
    balance roundrobin

    # Active HTTP Readiness Check against /api/v1/ready
    # Unhealthy servers are removed after 3 consecutive failures (fall 3)
    # Recovered servers rejoin rotation after 2 consecutive passes (rise 2)
    option httpchk GET /api/v1/ready HTTP/1.1\r\nHost:\ sentinel.internal
    http-check expect status 200

    # Preserve upstream X-Sentinel-Server header so clients/auditors can observe distribution
    server web01 10.0.10.11:3000 check inter 3000ms fall 3 rise 2 maxconn 1024
    server web02 10.0.10.12:3000 check inter 3000ms fall 3 rise 2 maxconn 1024
